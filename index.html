<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foreign Job Hunter AI</title><style>body{font-family:Arial;margin:0;background:#f4f6fa;color:#172033}header{background:#101827;color:white;padding:22px}.wrap{max-width:1100px;margin:auto;padding:20px}.card,.job{background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0001}.job{display:flex;justify-content:space-between;gap:15px}.score{font-size:25px;font-weight:bold;color:#087a4b}.btn{padding:10px 14px;border:0;border-radius:9px;background:#101827;color:#fff}@media(max-width:700px){.job{display:block}}</style><header><h1>🤖 Foreign Job Hunter AI</h1><div>Production Dashboard</div></header><div class=wrap><div class=card><b>SAP MM • S/4HANA • P2P • Procurement • 2 Years • Visa Sponsorship Required</b></div><h2>🎯 Ranked Jobs</h2><div id=jobs>Loading...</div><h2>📋 Applications</h2><div id=apps>Loading...</div></div><script>
async function get(u,o){return fetch(u,o).then(r=>r.json())}async function load(){let j=await get('/api/jobs');document.getElementById('jobs').innerHTML=j.length?j.map(x=>`<div class=job><div><h3>${x.title}</h3><b>${x.company}</b><p>${x.country} • ${x.salary||'Salary not listed'}</p><p>Visa: ${x.visa_signal} • ${JSON.parse(x.matched_skills||'[]').join(', ')}</p><a href="${x.url}" target=_blank>Original job</a></div><div><div class=score>${x.match_score}%</div><button class=btn onclick=prepare(${x.id})>Prepare CV & Application</button></div></div>`).join(''):'<div class=card>No jobs yet. Sync a permitted Greenhouse or Lever source.</div>';let a=await get('/api/applications');document.getElementById('apps').innerHTML=a.length?a.map(x=>`<div class=card><b>${x.title}</b> — ${x.company} — ${x.status}</div>`).join(''):'<div class=card>No applications yet.</div>'}async function prepare(id){let r=await get('/api/jobs/'+id+'/documents',{method:'POST'});alert('CV files prepared. Check data/generated on the server.');await get('/api/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:id})});load()}load()</script></html>
